<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렉스김어학원 - 선생님 상담 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; word-break: keep-all; }
        .checked-row { background-color: #f8fafc; opacity: 0.6; }
        .calling-row { background-color: #eff6ff; border-left: 5px solid #1d4ed8 !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-24">

    <div id="loginModal" class="fixed inset-0 bg-slate-900/80 z-[200] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-blue-900">선생님 로그인</h2>
                <p class="text-xs text-slate-400 mt-1">상담 시간표 관리 시스템입니다.</p>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">선생님 이름 선택</label>
                    <select id="teacherSelect" class="w-full p-3.5 border rounded-xl font-black text-slate-800 outline-none focus:border-blue-900 bg-slate-50 text-base">
                        <option value="">선생님을 선택하세요</option>
                    </select>
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-900 text-white py-3.5 rounded-xl font-black shadow-md hover:bg-blue-800 transition-all">로그인하기</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="bg-blue-900 text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-50">
            <div>
                <h1 class="text-lg font-black tracking-tighter">렉스김어학원 상담 관리</h1>
                <p id="currentTeacherDisplay" class="text-xs text-blue-300 font-bold mt-0.5"></p>
            </div>
            <button onclick="handleLogout()" class="text-[10px] font-bold bg-white/10 px-3 py-1.5 rounded-full text-white hover:bg-white/20">로그아웃</button>
        </header>

        <main class="max-w-4xl mx-auto p-4 md:p-6">
            <section class="bg-white p-4 rounded-2xl shadow-sm mb-6 border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-500">회차 선택:</span>
                    <select id="filterDate" onchange="loadSchedule()" class="p-2 border rounded-xl text-xs font-bold text-slate-700 outline-none focus:border-blue-900">
                        <option value="all">전체 회차 보기</option>
                    </select>
                </div>
                <div class="text-xs font-bold text-slate-400">
                    * 체크박스 변경 후 하단의 <span class="text-blue-600">■ 변경사항 일괄 저장하기</span> 버튼을 꼭 눌러야 스크린에 반영됩니다.
                </div>
            </section>

            <section class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-bold">
                                <th class="p-4 text-center w-16">상담완료</th>
                                <th class="p-4 text-center w-28 bg-blue-50 text-blue-900">📢 스크린호출</th>
                                <th class="p-4 w-24">상담시간</th>
                                <th class="p-4 w-28">회차</th>
                                <th class="p-4 w-20">레벨</th>
                                <th class="p-4">학생 이름 (영어)</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="6" class="p-8 text-center text-slate-400 font-bold">데이터를 불러오는 중입니다...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <div class="fixed bottom-0 left-0 right-0 bg-white/95 border-t p-4 z-40 shadow-2xl">
                <div class="max-w-4xl mx-auto flex justify-between items-center">
                    <div id="saveStatus" class="text-slate-500 font-bold text-xs">변경사항(상담 체크, 스크린 호출)을 저장해 주세요.</div>
                    <button onclick="saveAllTeacherData()" class="bg-blue-900 text-white px-8 py-3 rounded-xl text-xs font-black shadow-md hover:bg-blue-800 transition-all">
                        💾 변경사항 일괄 저장하기
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://lexkimhw-63c3b-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentTeacher = null;
        let appointmentData = {};
        let teacherCachedList = [];

        function initTeacherApp() {
            db.ref('settings/teachers').once('value', snap => {
                const teachers = snap.val() || {};
                const select = document.getElementById('teacherSelect');
                const teacherNames = new Set();
                Object.values(teachers).forEach(t => { if(t.name) teacherNames.add(t.name); });
                teacherCachedList = Array.from(teacherNames).sort();

                teacherCachedList.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name + " 선생님";
                    select.appendChild(opt);
                });
            });

            db.ref('settings/dates').once('value', snap => {
                const dates = snap.val() || {};
                const filterDate = document.getElementById('filterDate');
                Object.values(dates).forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.name;
                    opt.innerText = d.name;
                    filterDate.appendChild(opt);
                });
            });
        }

        function handleLogin() {
            const teacher = document.getElementById('teacherSelect').value;

            if(!teacher) return alert("선생님을 선택해 주세요.");

            currentTeacher = teacher;
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('currentTeacherDisplay').innerText = `안녕하세요, ${currentTeacher} 선생님`;
            
            db.ref('appointments').on('value', snap => {
                appointmentData = snap.val() || {};
                loadSchedule();
            });
        }

        function handleLogout() {
            currentTeacher = null;
            document.getElementById('teacherSelect').value = '';
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('hidden');
            db.ref('appointments').off();
        }

        function loadSchedule() {
            const tbody = document.getElementById('scheduleBody');
            const selectedDateFilter = document.getElementById('filterDate').value;
            tbody.innerHTML = '';

            let listItems = [];

            Object.keys(appointmentData).forEach(appKey => {
                const app = appointmentData[appKey];
                if (selectedDateFilter !== 'all' && app.date !== selectedDateFilter) return;

                if (app.items && Array.isArray(app.items)) {
                    app.items.forEach((item, index) => {
                        if (item.teacher === currentTeacher) {
                            listItems.push({
                                appKey: appKey,
                                itemIndex: index,
                                time: item.time,
                                date: app.date,
                                level: app.level,
                                krName: app.krName,
                                enName: app.enName || '-',
                                done: item.done || false,
                                check: item.check || false
                            });
                        }
                    });
                }
            });

            listItems.sort((a, b) => a.time.localeCompare(b.time));

            if (listItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-bold">배정된 예약 일정이 없습니다.</td></tr>`;
                return;
            }

            // [추가 로직 1] 첫 번째 학생의 스크린 호출이 아직 체크 안 되어 있고, 상담도 완료 안 되었다면 자동으로 체크 상태로 시작
            if (listItems.length > 0) {
                const firstUndone = listItems.find(item => !item.done);
                // 모든 학생이 완료된 상태가 아니고, 호출 상태가 둘 다 꺼져있는 초기 상태라면 첫 미완료 학생을 켭니다.
                const hasAnyCheck = listItems.some(item => item.check);
                if (firstUndone && !hasAnyCheck) {
                    firstUndone.check = true;
                }
            }

            listItems.forEach(item => {
                const tr = document.createElement('tr');
                
                let rowClass = "border-b border-slate-100 transition-all";
                if(item.done) rowClass += " checked-row";
                if(item.check) rowClass += " calling-row";
                tr.className = rowClass;
                
                tr.setAttribute('data-key', item.appKey);
                tr.setAttribute('data-idx', item.itemIndex);

                tr.innerHTML = `
                    <td class="p-4 text-center">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="handleDoneChange(this)" class="todo-done w-4 h-4 rounded text-slate-500 border-slate-300 focus:ring-slate-500">
                    </td>
                    <td class="p-4 text-center bg-blue-50/50">
                        <input type="checkbox" ${item.check ? 'checked' : ''} onchange="updateRowStyle(this)" class="todo-check w-5 h-5 rounded text-blue-600 border-blue-400 focus:ring-blue-600">
                        <span class="text-[10px] block font-bold text-blue-700 mt-0.5">화면표시</span>
                    </td>
                    <td class="p-4 font-bold text-blue-900">${item.time}</td>
                    <td class="p-4 font-medium text-slate-500 text-xs">${item.date}</td>
                    <td class="p-4"><span class="bg-slate-200 text-slate-800 text-xs font-black px-2 py-1 rounded">${item.level}</span></td>
                    <td class="p-4">
                        <div class="font-black text-slate-800">${item.krName}</div>
                        <div class="text-xs text-slate-400 font-semibold">${item.enName}</div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // [추가 로직 2] 상담 완료 체크박스 변경 시 자동 다음 사람 호출 처리
        function handleDoneChange(element) {
            const currentTr = element.closest('tr');
            const isDoneChecked = element.checked;
            
            // 현재 행의 스타일 업데이트
            updateRowStyle(element);

            // 상담 완료가 체크되었을 때만 다음 미완료 학생을 자동으로 체크함
            if (isDoneChecked) {
                // 현재 행의 스크린 호출은 해제해 주는 것이 자연스러우므로 해제 처리 (선택 사항)
                const currentCheckIdx = currentTr.querySelector('.todo-check');
                if(currentCheckIdx.checked) {
                    currentCheckIdx.checked = false;
                    updateRowStyle(currentCheckIdx);
                }

                // 테이블 내부의 모든 행을 가져옴
                const rows = Array.from(document.querySelectorAll('#scheduleBody tr[data-key]'));
                const currentIndex = rows.indexOf(currentTr);

                // 현재 상담 완료된 사람 '이후' 행들 중, 아직 상담이 완료되지 않은(done이 체크 안 된) 첫 번째 학생을 검색
                let nextTargetRow = null;
                for (let i = currentIndex + 1; i < rows.length; i++) {
                    const isRowDone = rows[i].querySelector('.todo-done').checked;
                    if (!isRowDone) {
                        nextTargetRow = rows[i];
                        break;
                    }
                }

                // 만약 뒤에 없다면 처음부터 다시 미완료 학생 검색 (순서 보완)
                if (!nextTargetRow) {
                    for (let i = 0; i < currentIndex; i++) {
                        const isRowDone = rows[i].querySelector('.todo-done').checked;
                        if (!isRowDone) {
                            nextTargetRow = rows[i];
                            break;
                        }
                    }
                }

                // 다음 미완료 대상을 찾았다면 스크린 호출 자동 체크 및 스타일 반영
                if (nextTargetRow) {
                    const nextCheckCheckbox = nextTargetRow.querySelector('.todo-check');
                    nextCheckCheckbox.checked = true;
                    updateRowStyle(nextCheckCheckbox);
                }
            }
        }

        function updateRowStyle(element) {
            const tr = element.closest('tr');
            const isDone = tr.querySelector('.todo-done').checked;
            const isCalling = tr.querySelector('.todo-check').checked;

            tr.className = "border-b border-slate-100 transition-all";
            if (isDone) tr.classList.add('checked-row');
            if (isCalling) tr.classList.add('calling-row');
        }

        function saveAllTeacherData() {
            const rows = document.querySelectorAll('#scheduleBody tr[data-key]');
            if(rows.length === 0) return alert("저장할 데이터가 없습니다.");

            const updates = {};

            rows.forEach(row => {
                const appKey = row.getAttribute('data-key');
                const idx = parseInt(row.getAttribute('data-idx'));
                
                const isDone = row.querySelector('.todo-done').checked;
                const isChecked = row.querySelector('.todo-check').checked;

                if(appointmentData[appKey] && appointmentData[appKey].items && appointmentData[appKey].items[idx]) {
                    appointmentData[appKey].items[idx].done = isDone;
                    appointmentData[appKey].items[idx].check = isChecked;
                    
                    updates[`/appointments/${appKey}/items/${idx}`] = appointmentData[appKey].items[idx];
                }
            });

            db.ref().update(updates).then(() => {
                const status = document.getElementById('saveStatus');
                status.innerText = "✨ 스크린 호출 및 완료 상태가 연동 저장되었습니다!";
                status.classList.remove('text-slate-500');
                status.classList.add('text-green-600');
                
                alert("성공적으로 저장되었습니다.");
                
                setTimeout(() => {
                    status.innerText = "변경사항(상담 체크, 스크린 호출)을 저장해 주세요.";
                    status.classList.remove('text-green-600');
                    status.classList.add('text-slate-500');
                }, 3000);
            }).catch(err => {
                console.error(err);
                alert("저장 도중 오류가 발생했습니다.");
            });
        }

        initTeacherApp();
    </script>
</body>
</html>
